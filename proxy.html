<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07091a;
    --bg2: #0d1030;
    --bg3: #111540;
    --bar: #141840;
    --bar-border: #1e2460;
    --accent: #3d6fff;
    --accent2: #6b9fff;
    --text: #c8d4f0;
    --text-muted: #5a6a9a;
    --glow: rgba(61,111,255,0.18);
    --radius: 14px;
    --radius-sm: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  /* ── Noise overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Shell ── */
  #shell {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── Top bar ── */
  #topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bar);
    border-bottom: 1px solid var(--bar-border);
    flex-shrink: 0;
  }

  .tb-btn {
    width: 30px; height: 30px;
    border: none;
    border-radius: 50%;
    background: var(--bg3);
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .tb-btn:hover { background: var(--bar-border); color: var(--text); }

  #url-bar {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--bg3);
    border: 1px solid var(--bar-border);
    border-radius: 8px;
    padding: 0 12px;
    gap: 8px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #url-bar:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--glow);
  }

  #url-icon {
    color: var(--text-muted);
    font-size: 12px;
    flex-shrink: 0;
  }

  #url-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12.5px;
    height: 34px;
  }
  #url-input::placeholder { color: var(--text-muted); }

  #go-btn {
    width: 30px; height: 30px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  #go-btn:hover { background: var(--accent2); }

  /* ── Logo ── */
  #logo {
    font-size: 15px;
    font-weight: 500;
    color: var(--accent2);
    letter-spacing: 0.08em;
    flex-shrink: 0;
    padding: 0 4px;
    user-select: none;
  }

  /* ── Content area ── */
  #content {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  /* ── Home screen ── */
  #home {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    background:
      radial-gradient(ellipse 60% 50% at 50% 60%, rgba(30,50,140,0.28) 0%, transparent 70%),
      var(--bg);
  }

  #home-title {
    font-size: clamp(38px, 8vw, 64px);
    font-weight: 300;
    letter-spacing: 0.18em;
    color: #fff;
    text-shadow: 0 0 60px rgba(61,111,255,0.5);
    user-select: none;
  }
  #home-title span {
    color: var(--accent2);
  }

  /* ── Center search bar ── */
  #home-search-wrap {
    width: min(520px, 90vw);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #home-search {
    display: flex;
    align-items: center;
    background: var(--bg2);
    border: 1.5px solid var(--bar-border);
    border-radius: 50px;
    padding: 0 20px;
    gap: 12px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.4), 0 0 0 0 var(--glow);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #home-search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 4px 40px rgba(0,0,0,0.4), 0 0 0 4px var(--glow);
  }

  #home-search-icon {
    color: var(--text-muted);
    font-size: 15px;
    flex-shrink: 0;
  }

  #home-search-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    height: 50px;
  }
  #home-search-input::placeholder { color: var(--text-muted); }

  #home-go {
    width: 34px; height: 34px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }
  #home-go:hover { background: var(--accent2); transform: scale(1.08); }

  #home-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  /* ── Proxy iframe ── */
  #frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: none;
    display: none;
    background: #fff;
  }

  /* ── Loading bar ── */
  #loading-bar {
    position: absolute;
    top: 0; left: 0;
    height: 2px;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.3s ease;
    z-index: 10;
    display: none;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bar-border); border-radius: 3px; }
</style>
</head>
<body>
<div id="shell">

  <!-- Top bar -->
  <div id="topbar">
    <button class="tb-btn" id="btn-back" title="Back">&#8592;</button>
    <button class="tb-btn" id="btn-fwd" title="Forward">&#8594;</button>
    <button class="tb-btn" id="btn-reload" title="Reload">&#8635;</button>
    <button class="tb-btn" id="btn-home" title="Home">&#8962;</button>

    <div id="url-bar">
      <span id="url-icon">&#128274;</span>
      <input id="url-input" type="text" placeholder="Search or enter address…" autocomplete="off" spellcheck="false">
      <button id="go-btn">&#10148;</button>
    </div>

    <div id="logo">Blue</div>
  </div>

  <!-- Content -->
  <div id="content">
    <div id="loading-bar"></div>

    <!-- Home -->
    <div id="home">
      <div id="home-title">Bl<span>u</span>e</div>

      <div id="home-search-wrap">
        <div id="home-search">
          <span id="home-search-icon">&#128269;</span>
          <input id="home-search-input" type="text" placeholder="Search the web or enter a URL…" autocomplete="off" spellcheck="false">
          <button id="home-go">&#10148;</button>
        </div>
        <div id="home-hint">Press Enter or click the arrow to browse</div>
      </div>
    </div>

    <!-- Proxy frame -->
    <iframe id="frame" sandbox="allow-forms allow-scripts allow-same-origin allow-popups"></iframe>
  </div>

</div>

<script>
  // ── Config ──────────────────────────────────────────────
  const WISP_URL = "wss://wisp-server-node-js4t.onrender.com/wisp/";

  // ── Elements ─────────────────────────────────────────────
  const urlInput    = document.getElementById('url-input');
  const goBtn       = document.getElementById('go-btn');
  const homeEl      = document.getElementById('home');
  const frame       = document.getElementById('frame');
  const loadingBar  = document.getElementById('loading-bar');
  const btnBack     = document.getElementById('btn-back');
  const btnFwd      = document.getElementById('btn-fwd');
  const btnReload   = document.getElementById('btn-reload');
  const btnHome     = document.getElementById('btn-home');
  const homeInput   = document.getElementById('home-search-input');
  const homeGo      = document.getElementById('home-go');
  const urlIcon     = document.getElementById('url-icon');

  // ── Helpers ───────────────────────────────────────────────
  function normalizeUrl(input) {
    input = input.trim();
    if (!input) return null;
    if (/^https?:\/\//i.test(input)) return input;
    if (/^[\w-]+\.[a-z]{2,}(\/|$)/i.test(input)) return 'https://' + input;
    return 'https://www.google.com/search?q=' + encodeURIComponent(input);
  }

  function setLoading(on) {
    loadingBar.style.display = on ? 'block' : 'none';
    if (on) {
      loadingBar.style.width = '0%';
      setTimeout(() => loadingBar.style.width = '70%', 50);
    } else {
      loadingBar.style.width = '100%';
      setTimeout(() => { loadingBar.style.width = '0%'; loadingBar.style.display = 'none'; }, 300);
    }
  }

  function setLock(secure) {
    urlIcon.innerHTML = secure ? '&#128274;' : '&#128275;';
    urlIcon.style.color = secure ? '#3d6fff' : '#ff6b6b';
  }

  // ── Navigation ────────────────────────────────────────────
  function navigate(raw) {
    const url = normalizeUrl(raw);
    if (!url) return;
    urlInput.value = url;
    homeEl.style.display = 'none';
    frame.style.display = 'block';
    setLoading(true);
    setLock(url.startsWith('https://'));

    // Use Scramjet if available, otherwise fallback to direct iframe
    if (window.__scramjet__ && window.__scramjet__.encodeUrl) {
      frame.src = window.__scramjet__.encodeUrl(url);
    } else {
      // Direct proxy via Wisp — works when integrated with Scramjet client
      frame.src = url;
    }
  }

  function goHome() {
    homeEl.style.display = 'flex';
    frame.style.display = 'none';
    frame.src = '';
    urlInput.value = '';
    homeInput.value = '';
    urlIcon.innerHTML = '&#128274;';
    urlIcon.style.color = '';
    setLoading(false);
  }

  // ── Events ────────────────────────────────────────────────
  goBtn.addEventListener('click', () => navigate(urlInput.value));
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') navigate(urlInput.value); });

  homeGo.addEventListener('click', () => navigate(homeInput.value));
  homeInput.addEventListener('keydown', e => { if (e.key === 'Enter') navigate(homeInput.value); });

  btnHome.addEventListener('click', goHome);
  btnBack.addEventListener('click', () => { try { frame.contentWindow.history.back(); } catch(e) {} });
  btnFwd.addEventListener('click',  () => { try { frame.contentWindow.history.forward(); } catch(e) {} });
  btnReload.addEventListener('click', () => {
    if (frame.style.display !== 'none') {
      setLoading(true);
      try { frame.contentWindow.location.reload(); } catch(e) { frame.src = frame.src; }
    }
  });

  frame.addEventListener('load', () => {
    setLoading(false);
    try {
      const loc = frame.contentWindow.location.href;
      if (loc && loc !== 'about:blank') {
        urlInput.value = loc;
        setLock(loc.startsWith('https://'));
      }
    } catch(e) {}
  });
</script>
</body>
</html>
